apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - name: demo
        image: python:3.10-slim
        command: ["python", "-u", "/app/metrics_emitter.py"]
        volumeMounts:
        - name: appcode
          mountPath: /app
      volumes:
      - name: appcode
        hostPath:
          path: /path/to/your/ai_autoscaler  # change for local testing
          type: Directory

